# Kubernetes module prep — uses Python backend + Postgres container
# Used to verify the Python backend works locally before deploying to EKS with RDS
# In EKS, the Postgres container is replaced by RDS (provisioned by Terraform)

services:
  db:
    image: postgres:15
    restart: unless-stopped
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: employees
    ports:
      - "5432:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - employee-network

  backend:
    build: ./backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://postgres:postgres@db:5432/employees
      ENVIRONMENT: dev
    ports:
      - "5000:5000"
    depends_on:
      db:
        condition: service_healthy
    networks:
      - employee-network

  frontend:
    build: ./frontend
    restart: unless-stopped
    ports:
      - "8080:80"
    depends_on:
      - backend
    networks:
      - employee-network

volumes:
  postgres-data:

networks:
  employee-network:
    driver: bridge
