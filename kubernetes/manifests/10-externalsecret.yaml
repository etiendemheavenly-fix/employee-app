# 10 — ExternalSecret + SecretStore
# External Secrets Operator (ESO) syncs secrets from AWS Secrets Manager
# into Kubernetes Secrets automatically.
#
# Flow:
#   AWS Secrets Manager (landmark-cluster-dev/employee-app)
#     └── ESO reads it via IRSA (no static credentials)
#           └── creates/updates Kubernetes Secret: db-credentials
#                 └── backend pod reads DATABASE_URL from the Secret
#
# SecretStore: tells ESO how to connect to AWS (which region, which auth method)
# ExternalSecret: tells ESO which secret to fetch and what K8s Secret to create
#
# Prerequisites:
#   - External Secrets Operator installed (helm install external-secrets ...)
#   - ServiceAccount app-sa with IRSA role that has secretsmanager:GetSecretValue
#
# Apply:   kubectl apply -f 10-externalsecret.yaml
# Check:   kubectl get secretstore -n employee-app
#          kubectl get externalsecret -n employee-app
#          kubectl get secret db-credentials -n employee-app
# Status:  kubectl describe externalsecret db-credentials -n employee-app

apiVersion: external-secrets.io/v1
kind: SecretStore
metadata:
  name: aws-secrets-manager
  namespace: employee-app
spec:
  provider:
    aws:
      service: SecretsManager
      region: us-east-1
      auth:
        jwt:
          serviceAccountRef:
            name: app-sa
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: db-credentials
  namespace: employee-app
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: aws-secrets-manager
    kind: SecretStore
  target:
    name: db-credentials
    creationPolicy: Owner
  data:
    - secretKey: DATABASE_URL
      remoteRef:
        key: landmark-cluster-dev/employee-app
        property: database_url
