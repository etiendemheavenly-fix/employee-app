# 12 — ResourceQuota + LimitRange
# ResourceQuota: caps total resource consumption for the entire namespace.
# LimitRange: sets default requests/limits for individual containers that don't specify them.
#
# Without resource limits, a single pod can consume all cluster resources
# and starve other workloads.
#
# Apply:   kubectl apply -f 12-resourcequota.yaml
# Check:   kubectl get resourcequota -n employee-app
#          kubectl get limitrange -n employee-app
# Inspect: kubectl describe resourcequota employee-app-quota -n employee-app

apiVersion: v1
kind: ResourceQuota
metadata:
  name: employee-app-quota
  namespace: employee-app
spec:
  hard:
    requests.cpu: "4"
    requests.memory: 4Gi
    limits.cpu: "8"
    limits.memory: 8Gi
    pods: "20"
---
apiVersion: v1
kind: LimitRange
metadata:
  name: employee-app-limits
  namespace: employee-app
spec:
  limits:
    - type: Container
      default:
        cpu: 500m
        memory: 512Mi
      defaultRequest:
        cpu: 100m
        memory: 128Mi
      max:
        cpu: "2"
        memory: 2Gi
