# 07 — Service
# A Service gives a stable DNS name and IP to a set of Pods.
# Pods come and go (restarts, scaling) — their IPs change.
# A Service always points to the right Pods via label selectors.
#
# Service types:
#   ClusterIP    — internal only, reachable within the cluster (default)
#   NodePort     — exposes on a port on every Node (for testing)
#   LoadBalancer — provisions a cloud load balancer (AWS NLB/ALB)
#
# Here we use ClusterIP — the ALB Ingress routes external traffic to these services.
#
# Apply:   kubectl apply -f 07-service.yaml
# Check:   kubectl get services -n employee-app
# Inspect: kubectl describe service backend -n employee-app
# DNS test (from inside a pod):
#   kubectl exec -it <pod> -n employee-app -- curl http://backend:5000/api/health

apiVersion: v1
kind: Service
metadata:
  name: backend
  namespace: employee-app
  labels:
    app: backend
spec:
  type: ClusterIP
  selector:
    app: backend
  ports:
    - name: http
      port: 5000
      targetPort: 5000
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: employee-app
  labels:
    app: frontend
spec:
  type: ClusterIP
  selector:
    app: frontend
  ports:
    - name: http
      port: 80
      targetPort: 80
