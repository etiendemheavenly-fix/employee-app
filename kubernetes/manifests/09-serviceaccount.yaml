# 09 — ServiceAccount
# A ServiceAccount gives a Pod an identity within the cluster.
# Combined with IRSA (IAM Roles for Service Accounts), the Pod can
# assume an AWS IAM role without any static credentials.
#
# How IRSA works:
#   1. EKS has an OIDC provider
#   2. The IAM role has a trust policy that allows this ServiceAccount to assume it
#   3. The annotation eks.amazonaws.com/role-arn links the two
#   4. The Pod gets a projected token mounted at runtime
#   5. AWS SDK automatically exchanges the token for temporary credentials
#
# This ServiceAccount gives the backend pod permission to:
#   - Pull images from ECR
#   - Read secrets from Secrets Manager
#   - Write logs to CloudWatch
#
# Apply:   kubectl apply -f 09-serviceaccount.yaml
# Check:   kubectl get serviceaccount app-sa -n employee-app
# Inspect: kubectl describe serviceaccount app-sa -n employee-app

apiVersion: v1
kind: ServiceAccount
metadata:
  name: app-sa
  namespace: employee-app
  annotations:
    eks.amazonaws.com/role-arn: "arn:aws:iam::075120018043:role/landmark-cluster-dev-app-sa"
